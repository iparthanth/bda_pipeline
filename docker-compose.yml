# One command: `docker compose up` builds the lake, analytics and dashboard data, then serves the dashboard
# at http://localhost:8765 (login links are printed in the `dashboard` service log).
# Optional S3-compatible storage (ING-5): `docker compose --profile minio up` and set
# EPISCOPE__PATHS__LAKE_ROOT=s3a://episcope/lake in .env.
services:
  pipeline:
    build: .
    image: episcope:1.0
    command: ["sh", "-c", "python -m orchestration.init_env && python -m orchestration.dag all"]
    env_file: [.env]
    environment:
      - EPISCOPE__SPARK__DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-6g}
    volumes:
      - ./data:/app/data
      - ./serving/out:/app/serving/out
      - ./.env:/app/.env
    mem_limit: 12g
  dashboard:
    image: episcope:1.0
    command: ["python", "-m", "serving.server", "--host", "0.0.0.0", "--port", "8765"]
    env_file: [.env]
    ports: ["8765:8765"]
    volumes:
      - ./serving/out:/app/serving/out:ro
      - ./data/runs:/app/data/runs
    depends_on:
      pipeline:
        condition: service_completed_successfully
  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-episcope}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-episcope-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  minio-init:
    profiles: ["minio"]
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: ["sh", "-c", "sleep 5 && mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID:-episcope} $${AWS_SECRET_ACCESS_KEY:-episcope-secret} && mc mb -p local/episcope"]
volumes:
  minio-data:
